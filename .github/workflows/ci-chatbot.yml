name: CI — Chatbot

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Install & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check required secrets
        run: |
          node -e "if(!process.env.GEMINI_API_KEY){console.error('GEMINI_API_KEY is missing. Add it to repository secrets.'); process.exit(1);} console.log('GEMINI_API_KEY present.');"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Build
        run: npm run build

      - name: (optional) Run tests
        if: success()
        run: |
          if [ -f package.json ] && npm run | grep -q test; then npm test || true; fi
